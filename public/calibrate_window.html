<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSF 1:1 Window &amp; Tile Calibrator</title>
  <style>
    :root {
      --jsf-unified-frame-w: clamp(320px, 41vw, 500px);
      --photo-w: 1.92;
      --photo-h: 3.156;
      --photo-tx: -46.55%;
      --photo-ty: -34.35%;
      --tile-top: 0.605;
      --tile-w: 0.1333;
      --tile-h: 0.1170;
      --tile-dx: 0px;
      --frame-scale: 1.0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #060507; color: #f3d489;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden; user-select: none;
    }
    .stage {
      position: relative; width: 100vw; height: 100dvh;
      display: flex; align-items: center; justify-content: center;
    }
    /* Real room photo layer */
    .photo-anchor {
      position: absolute;
      top: 50%; left: 50%;
      width: calc(var(--jsf-unified-frame-w) * var(--photo-w));
      height: calc(var(--jsf-unified-frame-w) * var(--photo-h));
      transform: translate(var(--photo-tx), var(--photo-ty));
      z-index: 1;
      pointer-events: none;
    }
    .photo-anchor img {
      width: 100%; height: 100%; display: block; object-fit: fill;
      opacity: 0.92;
    }
    /* Semi-transparent 3D frame wireframe so you see the photo window right through it */
    .frame-wireframe {
      position: relative;
      z-index: 10;
      width: var(--jsf-unified-frame-w);
      aspect-ratio: 976 / 1095;
      transform: scale(var(--frame-scale));
      border: 2px solid #00f0ff;
      box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.35), inset 0 0 0 22px rgba(243, 212, 137, 0.12);
      border-radius: 8px;
      pointer-events: none;
    }
    .frame-wireframe::before {
      content: '3D FRAME (976:1095)';
      position: absolute; top: 6px; left: 8px;
      font-size: 10px; color: #00f0ff; letter-spacing: 0.08em;
      background: rgba(0,0,0,0.65); padding: 2px 5px; border-radius: 3px;
    }
    .frame-inner-bevel {
      position: absolute; inset: 4.4%;
      border: 1.5px dashed rgba(253, 224, 71, 0.85);
      border-radius: 4px;
    }
    /* 4 Web Tile wireframes */
    .tiles-bar {
      position: fixed;
      top: calc(50dvh + var(--jsf-unified-frame-w) * var(--tile-top));
      left: calc(50% + var(--tile-dx));
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      gap: 0px;
      pointer-events: none;
    }
    .tile-cell {
      width: calc(var(--jsf-unified-frame-w) * var(--tile-w));
      height: calc(var(--jsf-unified-frame-w) * var(--tile-h));
      border: 1.5px solid #ff3b8b;
      background: rgba(255, 59, 139, 0.10);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #ff8ec0;
    }
    /* Control panel */
    .hud {
      position: fixed; top: 14px; right: 14px; z-index: 100;
      width: 310px; padding: 14px;
      background: rgba(12, 10, 14, 0.90);
      border: 1px solid rgba(243, 212, 137, 0.35);
      border-radius: 10px; backdrop-filter: blur(12px);
      font-size: 11px;
    }
    .hud h3 { margin: 0 0 10px; font-size: 12px; color: #fde68a; letter-spacing: 0.08em; }
    .row { display: grid; grid-template-columns: 105px 1fr 52px; align-items: center; gap: 8px; margin-bottom: 7px; }
    .row input[type=range] { width: 100%; accent-color: #f3d489; }
    .val { text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
    .btns { display: flex; gap: 6px; margin-top: 10px; }
    button {
      flex: 1; padding: 7px 8px; cursor: pointer;
      background: rgba(243, 212, 137, 0.14); color: #fde68a;
      border: 1px solid rgba(243, 212, 137, 0.45); border-radius: 6px;
      font-family: inherit; font-size: 11px;
    }
    button:hover { background: rgba(243, 212, 137, 0.28); }
    pre {
      margin: 10px 0 0; padding: 8px; background: #070609;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 10px; color: #9ae6b4; white-space: pre-wrap; user-select: text;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="photo-anchor"><img src="/assets/sean_window_crop_vertical_9_16.jpg" alt="Studio"></div>
    <div class="frame-wireframe"><div class="frame-inner-bevel"></div></div>
    <div class="tiles-bar">
      <div class="tile-cell">T1</div>
      <div class="tile-cell">T2</div>
      <div class="tile-cell">T3</div>
      <div class="tile-cell">T4</div>
    </div>
  </div>

  <div class="hud">
    <h3>1:1 WINDOW &amp; TILE CALIBRATOR</h3>
    <div class="row"><span>Frame Scale</span><input id="frame-scale" type="range" min="0.88" max="1.04" step="0.01" value="1.00"><span class="val" id="v-frame-scale">1.00</span></div>
    <div class="row"><span>Photo W (×W)</span><input id="photo-w" type="range" min="1.50" max="2.60" step="0.005" value="1.92"><span class="val" id="v-photo-w">1.920</span></div>
    <div class="row"><span>Photo H (×W)</span><input id="photo-h" type="range" min="2.50" max="4.40" step="0.005" value="3.156"><span class="val" id="v-photo-h">3.156</span></div>
    <div class="row"><span>Photo X (%)</span><input id="photo-tx" type="range" min="-60" max="-35" step="0.05" value="-46.55"><span class="val" id="v-photo-tx">-46.55%</span></div>
    <div class="row"><span>Photo Y (%)</span><input id="photo-ty" type="range" min="-45" max="-22" step="0.05" value="-34.35"><span class="val" id="v-photo-ty">-34.35%</span></div>
    <hr style="border:none;border-top:1px solid rgba(243,212,137,0.18);margin:8px 0;">
    <div class="row"><span>Tiles Top (×W)</span><input id="tile-top" type="range" min="0.50" max="0.80" step="0.002" value="0.605"><span class="val" id="v-tile-top">0.605</span></div>
    <div class="row"><span>Tile W (×W)</span><input id="tile-w" type="range" min="0.09" max="0.18" step="0.001" value="0.1333"><span class="val" id="v-tile-w">0.1333</span></div>
    <div class="row"><span>Tile H (×W)</span><input id="tile-h" type="range" min="0.09" max="0.18" step="0.001" value="0.1170"><span class="val" id="v-tile-h">0.1170</span></div>
    <div class="row"><span>Tiles dX (px)</span><input id="tile-dx" type="range" min="-60" max="60" step="1" value="0"><span class="val" id="v-tile-dx">0px</span></div>
    <div class="btns">
      <button id="btn-copy">Copy Values</button>
      <button id="btn-reset">Reset</button>
    </div>
    <pre id="out"></pre>
  </div>

  <script>
    const ids = ['frame-scale','photo-w','photo-h','photo-tx','photo-ty','tile-top','tile-w','tile-h','tile-dx'];
    const root = document.documentElement.style;
    const out = document.getElementById('out');
    function update() {
      const vals = {};
      ids.forEach((id) => {
        const el = document.getElementById(id);
        const v = el.value;
        const unit = id.startsWith('photo-t') ? '%' : (id === 'tile-dx' ? 'px' : '');
        root.setProperty('--' + id, v + unit);
        document.getElementById('v-' + id).textContent = v + unit;
        vals[id] = v + unit;
      });
      out.textContent = JSON.stringify(vals, null, 2);
    }
    ids.forEach((id) => document.getElementById(id).addEventListener('input', update));
    document.getElementById('btn-copy').addEventListener('click', () => {
      navigator.clipboard && navigator.clipboard.writeText(out.textContent);
    });
    document.getElementById('btn-reset').addEventListener('click', () => location.reload());
    update();
  </script>
</body>
</html>
