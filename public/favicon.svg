<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Bordeaux Wine Gradient Background -->
    <linearGradient id="wineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A051C" />
      <stop offset="50%" stop-color="#72092C" />
      <stop offset="100%" stop-color="#2D0210" />
    </linearGradient>

    <!-- Antique Champagne Gold Gradient for Treble Clef -->
    <linearGradient id="goldClef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Rich Red Wine Liquid Gradient -->
    <linearGradient id="wineLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <!-- Outer Gold Border Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFD54F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background (Bordeaux Velvet) -->
  <rect width="128" height="128" rx="28" fill="url(#wineBg)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#goldClef)" stroke-width="2.5" opacity="0.85" />

  <!-- Wine Glass Top Bowl Fill (Ruby Wine Liquid) -->
  <path d="M 44 32 C 44 48, 84 48, 84 32 Z" fill="url(#wineLiquid)" opacity="0.9" />

  <!-- Wine Glass Rim & Contour -->
  <path d="M 42 22 L 86 22 C 86 46, 76 60, 64 64 C 52 60, 42 46, 42 22 Z" 
        fill="none" stroke="url(#goldClef)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Treble Clef S-Curve integrated into Wine Glass Stem & Base -->
  <path d="M 64 12 
           C 66 12, 69 16, 69 22 
           C 69 34, 52 46, 52 62 
           C 52 74, 62 82, 72 82 
           C 80 82, 85 76, 85 68 
           C 85 58, 76 52, 66 52 
           C 56 52, 48 60, 48 72 
           C 48 88, 64 100, 64 114
           C 64 118, 60 120, 56 120
           C 52 120, 50 116, 52 112
           C 54 108, 58 108, 60 110" 
        fill="none" stroke="url(#goldClef)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Treble Clef Center Crossbar / Note Dot -->
  <circle cx="64" cy="68" r="4.5" fill="url(#goldClef)" />
</svg>
